<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Markout 點存系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root,
    [data-theme="light"] {
      --bg: #f7f6f2;
      --surface: #ffffff;
      --surface-2: #f3f1eb;
      --text: #1f2328;
      --muted: #667085;
      --border: rgba(31, 35, 40, 0.12);
      --primary: #0f766e;
      --primary-2: #115e59;
      --danger: #b42318;
      --danger-soft: #fee4e2;
      --success-soft: #ecfdf3;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      --radius: 16px;
      --radius-sm: 12px;
      --font: "Inter", "Noto Sans TC", sans-serif;
    }

    [data-theme="dark"] {
      --bg: #121417;
      --surface: #1c2128;
      --surface-2: #232a33;
      --text: #f3f4f6;
      --muted: #a1aab6;
      --border: rgba(255, 255, 255, 0.12);
      --primary: #34d399;
      --primary-2: #10b981;
      --danger: #f97066;
      --danger-soft: rgba(249, 112, 102, 0.12);
      --success-soft: rgba(52, 211, 153, 0.12);
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input { font: inherit; color: inherit; }
    button { border: 0; background: none; cursor: pointer; }

    input {
      min-width: 44px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      padding: 12px 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .skip-link { position: absolute; left: -9999px; top: 0; }
    .skip-link:focus {
      left: 12px; top: 12px; z-index: 99;
      background: var(--surface); padding: 10px 12px;
      border-radius: 10px; box-shadow: var(--shadow);
    }

    /* ── App wrapper ── */
    .app {
      max-width: 720px;
      margin: 0 auto;
      /* bottom padding accounts for: search(44) + gap(7) + strip(20) + gap(7) + nav(52) + top/bottom padding(20) + safe-area ~34 = ~184 */
      padding: 16px 16px 190px;
    }

    /* ── Top bar (brand only, no search) ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      margin: -16px -16px 12px;
      padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
    }

    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

    .logo {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      display: grid; place-items: center;
      box-shadow: var(--shadow); flex: 0 0 auto;
    }

    .brand-title { font-size: 17px; font-weight: 700; line-height: 1.2; }
    .brand-subtitle { font-size: 12px; color: var(--muted); line-height: 1.2; }

    .icon-btn {
      min-width: 44px; min-height: 44px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface);
      display: grid; place-items: center;
    }

    /* ── Main panel ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      margin-bottom: 12px;
    }

    /* ── Stats grid (inside summarySheet) ── */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .stat { background: var(--surface-2); border-radius: 12px; padding: 10px; }
    .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .stat-value { font-size: 15px; font-weight: 700; }

    /* ── Search wrap (shared by bottom bar) ── */
    .search-wrap { position: relative; flex: 1; }
    .search-wrap input {
      width: 100%;
      padding-right: 44px;
      -webkit-appearance: none;
      appearance: none;
    }
    /* Remove browser-native clear button on type=search (just in case) */
    .search-wrap input::-webkit-search-cancel-button { display: none; }

    .clear-search {
      position: absolute; right: 6px; top: 50%;
      transform: translateY(-50%);
      min-width: 32px; min-height: 32px;
      border-radius: 999px; background: var(--surface-2);
      display: none;
    }
    .clear-search.show { display: grid; place-items: center; }

    /* ── Buttons ── */
    .btn {
      min-height: 44px; border-radius: 12px;
      padding: 12px 14px; font-weight: 600; border: 1px solid transparent;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--surface-2); border-color: var(--border); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); }

    /* ── Product list ── */
    .list { display: grid; gap: 10px; }

    .product-row {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .product-head { display: flex; gap: 10px; align-items: start; justify-content: space-between; }
    .meta { min-width: 0; }
    .code { font-size: 13px; font-weight: 700; color: var(--primary); letter-spacing: 0.02em; word-break: break-all; }
    .en { font-size: 15px; font-weight: 700; line-height: 1.35; margin-top: 2px; }
    .zh { font-size: 13px; color: var(--muted); line-height: 1.35; margin-top: 2px; }

    .qty-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .qty-box { background: var(--surface-2); border-radius: 12px; padding: 10px; }
    .qty-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }

    .stepper { display: grid; grid-template-columns: 40px 1fr 40px; gap: 6px; align-items: center; }
    .stepper button {
      min-width: 40px; min-height: 40px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      font-size: 20px; line-height: 1;
    }
    .stepper input {
      min-height: 40px; min-width: 30px; width: 100%;
      text-align: center; padding: 8px 4px; font-weight: 700;
    }

    .empty {
      border: 1px dashed var(--border); border-radius: 14px;
      padding: 18px; text-align: center;
      color: var(--muted); background: var(--surface-2);
    }

    /* ── Bottom Bar ── */
    .bottom-bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 40;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
    }

    .bottom-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    /* Row 1: filter button + search */
    .bottom-search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Small square filter-no-record button */
    #filterNoRecordBtn {
      flex: 0 0 auto;
      min-width: 44px; min-height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: grid; place-items: center;
      color: var(--muted);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    #filterNoRecordBtn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Row 2: summary strip */
    .summary-strip {
      font-size: 12px; color: var(--muted);
      text-align: center; font-weight: 600;
      line-height: 1; padding: 1px 0;
    }

    /* Row 3: nav buttons */
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .nav-btn {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px; padding: 7px 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 600; cursor: pointer;
    }
    .nav-icon { font-size: 18px; line-height: 1; }
    .nav-label { font-size: 10px; line-height: 1.2; }
    .nav-btn.nav-danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
    .nav-btn.active { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

    /* ── Sheet backdrop ── */
    .sheet-backdrop {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.45);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease; z-index: 50;
    }
    .sheet-backdrop.show { opacity: 1; pointer-events: auto; }

    /* ── Base sheet (bottom sheet, e.g. addSheet) ── */
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      z-index: 60;
      background: var(--surface);
      border-top-left-radius: 22px; border-top-right-radius: 22px;
      box-shadow: 0 -18px 40px rgba(15, 23, 42, 0.22);
      padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
      transform: translateY(105%);
      transition: transform 0.22s ease;
      max-height: 88dvh; overflow: auto;
    }
    .sheet.show { transform: translateY(0); }

    /* ── Full-screen sheet (summarySheet) ── */
    .sheet-fullscreen {
      top: 0;
      border-radius: 0;
      max-height: 100dvh;
      padding-top: calc(env(safe-area-inset-top) + 14px);
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
    }
    .sheet-fullscreen .sheet-handle { display: none; }

    .sheet-handle {
      width: 42px; height: 5px; border-radius: 999px;
      background: var(--border); margin: 0 auto 10px;
    }

    .sheet-head {
      display: flex; align-items: center;
      justify-content: space-between; gap: 10px; margin-bottom: 10px;
    }
    .sheet-title { font-size: 17px; font-weight: 700; }

    /* ── Add product form ── */
    .form-grid { display: grid; gap: 10px; }
    .field label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--muted); font-weight: 600; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

    /* ── Summary list ── */
    .summary-list { display: grid; gap: 8px; margin-top: 6px; }
    .summary-item {
      border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 12px; display: grid; gap: 4px;
      background: var(--surface-2);
    }
    .summary-top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
    .summary-name { font-size: 14px; font-weight: 700; line-height: 1.35; }
    .summary-code { font-size: 12px; color: var(--primary); font-weight: 700; }
    .summary-qty { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
    .summary-badge {
      min-width: 54px; text-align: center; border-radius: 999px;
      padding: 4px 8px; background: var(--success-soft); font-weight: 700;
    }
    .summary-badge.return { background: var(--danger-soft); color: var(--danger); }

    .helper { font-size: 12px; color: var(--muted); margin-top: 6px; }

    /* ── Filter bar (inside summarySheet) ── */
    .filter-bar { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-filter {
      font-size: 13px; padding: 8px 16px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface-2);
      color: var(--muted); font-weight: 500;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn-filter.active { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

    /* ── Responsive ── */
    @media (max-width: 360px) {
      .stepper { grid-template-columns: 36px 1fr 36px; gap: 4px; }
      .stepper button { min-width: 36px; min-height: 36px; font-size: 18px; }
      .qty-box { padding: 8px; }
    }
    @media (min-width: 640px) {
      .qty-grid { grid-template-columns: repeat(2, minmax(0, 220px)); }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    /* ── Price warning & amount stats ── */
    .price-warning {
      font-size: 13px;
      color: var(--danger);
      background: var(--danger-soft);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .stats-2col { grid-template-columns: 1fr 1fr; }
    .stat-value-amount { font-size: 15px; font-weight: 700; color: var(--primary); }
    .summary-amounts { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
    .amount-badge {
      border-radius: 999px; padding: 3px 8px;
      background: var(--surface); border: 1px solid var(--border);
      font-weight: 600; font-size: 11px;
    }
    .amount-badge.return { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
  </style>
</head>
<body data-theme="light">
  <a class="skip-link" href="#main">跳至內容</a>

  <div class="app">
    <!-- Top bar: brand + theme toggle only (search moved to bottom) -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M5 18h14M7 18V9l5-3 5 3v9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10 18v-4h4v4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div>
            <div class="brand-title">Markout 點存系統</div>
            <div class="brand-subtitle">Tin Updated: 31-5-2026</div>
          </div>
        </div>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="切換深淺色模式">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
    </header>

    <main id="main">
      <!-- Stats panel and toolbar panel removed from main; moved into summarySheet / bottom nav -->
      <section class="panel">
        <div id="productList" class="list" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <!-- ── Bottom Bar: search + summary strip + nav ── -->
  <div class="bottom-bar">
    <div class="bottom-inner">

      <!-- Row 1: no-record filter button + search input -->
      <div class="bottom-search-row">
        <button
          id="filterNoRecordBtn"
          type="button"
          aria-label="篩選未有紀錄的產品"
          title="篩選未有填寫數量的產品"
        >
          <!-- Funnel / filter icon -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M7 12h10M11 18h2"/>
          </svg>
        </button>
        <div class="search-wrap">
          <input
            id="searchInput"
            type="text"
            placeholder="搜尋編號／英文／中文名稱"
            aria-label="搜尋產品"
            autocomplete="off"
          />
          <button class="clear-search" id="clearSearch" type="button" aria-label="清除搜尋文字">✕</button>
        </div>
      </div>

      <!-- Row 2: summary strip -->
      <div class="summary-strip" id="bottomSummary">已選 0 項｜保存 0｜退貨 0</div>

      <!-- Row 3: nav buttons -->
      <div class="bottom-nav">
        <button class="nav-btn" id="openSummary" type="button">
          <span class="nav-icon">☰</span>
          <span class="nav-label">查看清單</span>
        </button>
        <button class="nav-btn nav-danger" id="resetAll" type="button">
          <span class="nav-icon">♻</span>
          <span class="nav-label">一鍵清空</span>
        </button>
        <button class="nav-btn" id="filterReturnBtn" type="button">
          <span class="nav-icon">▼</span>
          <span class="nav-label">退貨篩選</span>
        </button>
        <button class="nav-btn" id="openAddSheet" type="button">
          <span class="nav-icon">✚</span>
          <span class="nav-label">新增產品</span>
        </button>
      </div>

    </div>
  </div>

  <div class="sheet-backdrop" id="backdrop"></div>

  <!-- Add Sheet (bottom sheet) -->
  <section class="sheet" id="addSheet" aria-hidden="true">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <div class="sheet-title">新增產品</div>
      <button class="icon-btn" type="button" data-close="addSheet" aria-label="關閉新增產品">✕</button>
    </div>

    <form id="addForm" class="form-grid">
      <div class="field">
        <label for="newCode">產品編號 Product Code</label>
        <input
          id="newCode" name="code" type="text"
          inputmode="numeric" pattern="[0-9]*"
          placeholder="只可輸入數字，保留最前面的 0"
          autocomplete="off" required
        />
      </div>

      <div class="field">
        <label for="newEn">英文名稱 English Name</label>
        <input id="newEn" name="en" type="text" placeholder="例如 BlueScon" autocomplete="off" required />
      </div>

      <div class="field">
        <label for="newZh">中文名稱 Chinese Name</label>
        <input id="newZh" name="zh" type="text" placeholder="如有中文名稱可輸入" autocomplete="off" />
        <div class="hint">中文名稱可留空，但建議填寫。</div>
      </div>

      <button class="btn btn-primary" type="submit">加入產品</button>
    </form>
  </section>

  <!-- Summary Sheet (full-screen) -->
  <section class="sheet sheet-fullscreen" id="summarySheet" aria-hidden="true">
    <div class="sheet-head">
      <div class="sheet-title">查看清單</div>
      <button class="icon-btn" type="button" data-close="summarySheet" aria-label="關閉查看清單">✕</button>
    </div>

    <!-- Stats grid (moved from main screen) -->
    <div class="stats" style="margin-bottom:12px">
      <div class="stat">
        <div class="stat-label">產品</div>
        <div class="stat-value" id="statProducts">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">已選</div>
        <div class="stat-value" id="statSelected">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">保存</div>
        <div class="stat-value" id="statSave">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">退貨</div>
        <div class="stat-value" id="statReturn">0</div>
      </div>
    </div>

    <!-- Amount stats -->
    <div class="stats stats-2col" id="amountStatsGrid" style="margin-bottom:8px">
      <div class="stat">
        <div class="stat-label">保存金額</div>
        <div class="stat-value stat-value-amount" id="statSaveAmount">$0</div>
      </div>
      <div class="stat">
        <div class="stat-label">退貨金額</div>
        <div class="stat-value stat-value-amount" id="statReturnAmount">$0</div>
      </div>
    </div>

    <!-- Price warning -->
    <div id="priceWarning" class="price-warning" style="display:none">⚠️ 產品未設定售價</div>

    <div class="helper">緊縮排版只顯示已輸入保存或退貨數量的產品。</div>
    <div class="filter-bar">
      <button class="btn btn-filter" id="summaryFilterReturnBtn" type="button">退貨篩選</button>
    </div>
    <div class="summary-list" id="summaryList"></div>
  </section>

    // Price lookup map (built from seedProducts)
    const priceMap = Object.fromEntries(seedProducts.map(p => [p.code, p.price || 0]));

    const DB_NAME = "pastry-order-mobile-app";
    const STORE_NAME = "appState";
    const STORE_KEY = "state";

    const state = {
      theme: "light",
      search: "",
      filterReturn: false,
      filterNoRecord: false,
      summaryFilterReturn: false,
      products: []
    };

    const el = {
      body: document.body,
      themeToggle: document.getElementById("themeToggle"),
      themeIcon: document.getElementById("themeIcon"),
      statProducts: document.getElementById("statProducts"),
      statSelected: document.getElementById("statSelected"),
      statSave: document.getElementById("statSave"),
      statReturn: document.getElementById("statReturn"),
      searchInput: document.getElementById("searchInput"),
      clearSearch: document.getElementById("clearSearch"),
      filterNoRecordBtn: document.getElementById("filterNoRecordBtn"),
      productList: document.getElementById("productList"),
      bottomSummary: document.getElementById("bottomSummary"),
      openAddSheet: document.getElementById("openAddSheet"),
      openSummary: document.getElementById("openSummary"),
      resetAll: document.getElementById("resetAll"),
      addSheet: document.getElementById("addSheet"),
      summarySheet: document.getElementById("summarySheet"),
      backdrop: document.getElementById("backdrop"),
      addForm: document.getElementById("addForm"),
      summaryList: document.getElementById("summaryList"),
      filterReturnBtn: document.getElementById("filterReturnBtn"),
      summaryFilterReturnBtn: document.getElementById("summaryFilterReturnBtn"),
      statSaveAmount: document.getElementById("statSaveAmount"),
      statReturnAmount: document.getElementById("statReturnAmount"),
      priceWarning: document.getElementById("priceWarning")
    };

    let dbPromise = null;
    let activeSheet = null;
    let saveTimer = null;

    function uid() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function digitsOnly(value) {
      return String(value ?? "").replace(/\D+/g, "");
    }

    function qtyValue(value) {
      const n = Number(digitsOnly(value));
      return Number.isFinite(n) ? n : 0;
    }

    function cloneSeedProducts() {
      return seedProducts.map(item => ({
        id: uid(),
        code: digitsOnly(item.code),
        en: String(item.en || "").trim(),
        zh: String(item.zh || "").trim(),
        save: 0,
        return: 0
      }));
    }

    function openDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      return dbPromise;
    }

    async function readState() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const request = store.get(STORE_KEY);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function writeState() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        const payload = JSON.parse(JSON.stringify(state));
        const request = store.put(payload, STORE_KEY);
        request.onsuccess = () => resolve(true);
        request.onerror = () => reject(request.error);
      });
    }

    function persistSoon() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => { writeState().catch(() => {}); }, 60);
    }

    function getSystemTheme() {
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function applyTheme(theme) {
      state.theme = theme;
      el.body.setAttribute("data-theme", theme);
      el.themeIcon.textContent = theme === "dark" ? "☀️" : "🌙";
      persistSoon();
    }

    function getFilteredProducts() {
      const keyword = state.search.trim().toLowerCase();
      let products = state.filterReturn
        ? state.products.filter(p => (p.return || 0) > 0)
        : state.products;

      if (state.filterNoRecord) {
        products = products.filter(p => (p.save || 0) === 0 && (p.return || 0) === 0);
      }

      if (!keyword) return products;
      return products.filter(p =>
        p.code.toLowerCase().includes(keyword) ||
        p.en.toLowerCase().includes(keyword) ||
        p.zh.toLowerCase().includes(keyword)
      );
    }

    function updateFilterBtn() {
      el.filterReturnBtn.classList.toggle("active", state.filterReturn);
    }

    function updateFilterNoRecordBtn() {
      el.filterNoRecordBtn.classList.toggle("active", state.filterNoRecord);
    }

    function updateSummaryFilterBtn() {
      el.summaryFilterReturnBtn.classList.toggle("active", state.summaryFilterReturn);
      el.summaryFilterReturnBtn.textContent = state.summaryFilterReturn ? "退貨篩選 ✓" : "退貨篩選";
    }

    function getSummary() {
      const selected = state.products.filter(p => (p.save || 0) > 0 || (p.return || 0) > 0);
      const saveTotal = state.products.reduce((sum, p) => sum + (p.save || 0), 0);
      const returnTotal = state.products.reduce((sum, p) => sum + (p.return || 0), 0);
      return { selected, saveTotal, returnTotal };
    }

    function renderProducts() {
      const products = getFilteredProducts();

      if (!products.length) {
        el.productList.innerHTML = '<div class="empty">找不到產品，請修改搜尋字詞或新增產品。</div>';
        return;
      }

      el.productList.innerHTML = products.map(product => `
        <article class="product-row" data-id="${escapeHtml(product.id)}">
          <div class="product-head">
            <div class="meta">
              <div class="code">${escapeHtml(product.code)}</div>
              <div class="en">${escapeHtml(product.en || "-")}</div>
              ${product.zh ? `<div class="zh">${escapeHtml(product.zh)}</div>` : ""}
            </div>
          </div>

          <div class="qty-grid">
            <div class="qty-box">
              <div class="qty-label">保存</div>
              <div class="stepper">
                <button type="button" data-action="minus" data-field="save" aria-label="減少保存">−</button>
                <input
                  type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done"
                  data-role="qty-input" data-field="save" aria-label="保存數量"
                  value="${product.save ? escapeHtml(product.save) : ""}"
                  placeholder="0" autocomplete="off"
                />
                <button type="button" data-action="plus" data-field="save" aria-label="增加保存">+</button>
              </div>
            </div>

            <div class="qty-box">
              <div class="qty-label">退貨</div>
              <div class="stepper">
                <button type="button" data-action="minus" data-field="return" aria-label="減少退貨">−</button>
                <input
                  type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done"
                  data-role="qty-input" data-field="return" aria-label="退貨數量"
                  value="${product.return ? escapeHtml(product.return) : ""}"
                  placeholder="0" autocomplete="off"
                />
                <button type="button" data-action="plus" data-field="return" aria-label="增加退貨">+</button>
              </div>
            </div>
          </div>
        </article>
      `).join("");
    }

    function renderSummary() {
      const { selected, saveTotal, returnTotal } = getSummary();

      el.statProducts.textContent = String(state.products.length);
      el.statSelected.textContent = String(selected.length);
      el.statSave.textContent = String(saveTotal);
      el.statReturn.textContent = String(returnTotal);
      el.bottomSummary.textContent = `已選 ${selected.length} 項｜保存 ${saveTotal}｜退貨 ${returnTotal}`;

      // 計算保存 / 退貨金額總和
      const saveAmountTotal   = selected.reduce((sum, item) => sum + (item.save   || 0) * (priceMap[item.code] || 0), 0);
      const returnAmountTotal = selected.reduce((sum, item) => sum + (item.return || 0) * (priceMap[item.code] || 0), 0);
      el.statSaveAmount.textContent   = `$${saveAmountTotal}`;
      el.statReturnAmount.textContent = `$${returnAmountTotal}`;

      // 若任何已選產品未設定售價，顯示警告
      const hasUnpriced = selected.some(item => !(priceMap[item.code] || 0));
      el.priceWarning.style.display = hasUnpriced ? '' : 'none';

      const displayItems = state.summaryFilterReturn
        ? selected.filter(item => (item.return || 0) > 0)
        : selected;

      if (!displayItems.length) {
        el.summaryList.innerHTML = `<div class="empty">${state.summaryFilterReturn ? "目前未有退貨數量的產品。" : "目前未有任何已輸入數量的產品。"}</div>`;
        return;
      }

      el.summaryList.innerHTML = displayItems.map(item => {
        const price = priceMap[item.code] || 0;
        const saveAmt   = (item.save   || 0) * price;
        const returnAmt = (item.return || 0) * price;
        const noPriceTag = price === 0
          ? ` <span style="color:var(--danger);font-size:11px;font-weight:600">⚠️ 未設定售價</span>`
          : '';
        return `
          <div class="summary-item">
            <div class="summary-top">
              <div>
                <div class="summary-code">${escapeHtml(item.code)}</div>
                <div class="summary-name">${escapeHtml(item.en)}${item.zh ? "｜" + escapeHtml(item.zh) : ""}${noPriceTag}</div>
              </div>
            </div>
            <div class="summary-qty">
              <span class="summary-badge">保存 ${item.save || 0}</span>
              <span class="summary-badge return">退貨 ${item.return || 0}</span>
            </div>
            ${price > 0 ? `<div class="summary-amounts">
              <span class="amount-badge">保存金額 $${saveAmt}</span>
              <span class="amount-badge return">退貨金額 $${returnAmt}</span>
            </div>` : ''}
          </div>
        `;
      }).join('');
    }

        function renderSearchClear() {
      el.clearSearch.classList.toggle("show", Boolean(el.searchInput.value));
    }

    function renderAll() {
      renderProducts();
      renderSummary();
      renderSearchClear();
    }

    function findProductById(id) {
      return state.products.find(item => item.id === id);
    }

    function setQty(productId, field, rawValue) {
      const item = findProductById(productId);
      if (!item || !["save", "return"].includes(field)) return;
      item[field] = qtyValue(rawValue);
      persistSoon();
      renderAll();
    }

    function setQtyQuiet(productId, field, rawValue) {
      const item = findProductById(productId);
      if (!item || !["save", "return"].includes(field)) return;
      item[field] = qtyValue(rawValue);
      persistSoon();
      renderSummary();
    }

    function stepQty(productId, field, diff) {
      const item = findProductById(productId);
      if (!item || !["save", "return"].includes(field)) return;
      item[field] = Math.max(0, (item[field] || 0) + diff);
      persistSoon();
      renderAll();
    }

    function openSheet(sheetId) {
      const sheet = document.getElementById(sheetId);
      if (!sheet) return;
      activeSheet = sheet;
      el.backdrop.classList.add("show");
      sheet.classList.add("show");
      sheet.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeActiveSheet() {
      if (!activeSheet) return;
      activeSheet.classList.remove("show");
      activeSheet.setAttribute("aria-hidden", "true");
      activeSheet = null;
      el.backdrop.classList.remove("show");
      document.body.style.overflow = "";
    }

    function resetToSeedData() {
      state.search = "";
      state.filterReturn = false;
      state.filterNoRecord = false;
      state.summaryFilterReturn = false;
      state.products = cloneSeedProducts();
      el.searchInput.value = "";
      persistSoon();
      updateFilterBtn();
      updateFilterNoRecordBtn();
      updateSummaryFilterBtn();
      renderAll();
      closeActiveSheet();
    }

    async function hydrate() {
      try {
        const saved = await readState();
        if (saved && Array.isArray(saved.products)) {
          state.theme = saved.theme || getSystemTheme();
          state.search = saved.search || "";
          state.filterReturn = saved.filterReturn || false;
          state.filterNoRecord = saved.filterNoRecord || false;
          state.summaryFilterReturn = saved.summaryFilterReturn || false;
          state.products = saved.products.map(item => ({
            id: item.id || uid(),
            code: digitsOnly(item.code),
            en: String(item.en || "").trim(),
            zh: String(item.zh || "").trim(),
            save: qtyValue(item.save),
            return: qtyValue(item.return)
          }));
        } else {
          state.theme = getSystemTheme();
          state.products = cloneSeedProducts();
          await writeState();
        }
      } catch (error) {
        state.theme = getSystemTheme();
        state.products = cloneSeedProducts();
      }

      applyTheme(state.theme);
      el.searchInput.value = state.search;
      updateFilterBtn();
      updateFilterNoRecordBtn();
      updateSummaryFilterBtn();
      renderAll();
    }

    /* ── Event listeners ── */

    el.themeToggle.addEventListener("click", () => {
      applyTheme(state.theme === "dark" ? "light" : "dark");
    });

    el.filterReturnBtn.addEventListener("click", () => {
      state.filterReturn = !state.filterReturn;
      updateFilterBtn();
      persistSoon();
      renderProducts();
    });

    el.filterNoRecordBtn.addEventListener("click", () => {
      state.filterNoRecord = !state.filterNoRecord;
      updateFilterNoRecordBtn();
      persistSoon();
      renderProducts();
    });

    el.summaryFilterReturnBtn.addEventListener("click", () => {
      state.summaryFilterReturn = !state.summaryFilterReturn;
      updateSummaryFilterBtn();
      persistSoon();
      renderSummary();
    });

    el.searchInput.addEventListener("input", e => {
      state.search = e.target.value || "";
      persistSoon();
      renderAll();
    });

    el.searchInput.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        el.searchInput.blur();
      }
    });

    el.clearSearch.addEventListener("click", () => {
      state.search = "";
      el.searchInput.value = "";
      persistSoon();
      renderAll();
      el.searchInput.focus();
    });

    el.productList.addEventListener("click", e => {
      const button = e.target.closest("button");
      if (!button) return;
      const row = e.target.closest(".product-row");
      if (!row) return;
      const productId = row.dataset.id;
      const action = button.dataset.action;
      const field = button.dataset.field;
      if (action === "plus") stepQty(productId, field, 1);
      if (action === "minus") stepQty(productId, field, -1);
    });

    el.productList.addEventListener("input", e => {
      const input = e.target.closest('input[data-role="qty-input"]');
      if (!input) return;
      input.value = digitsOnly(input.value);
      const row = e.target.closest(".product-row");
      if (!row) return;
      setQtyQuiet(row.dataset.id, input.dataset.field, input.value);
    });

    el.productList.addEventListener("blur", e => {
      const input = e.target.closest('input[data-role="qty-input"]');
      if (!input) return;
      input.value = digitsOnly(input.value);
      if (!input.value) input.value = "";
    }, true);

    el.productList.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      const input = e.target.closest('input[data-role="qty-input"]');
      if (!input) return;
      e.preventDefault();
      input.blur();
    });

    el.openAddSheet.addEventListener("click", () => openSheet("addSheet"));
    el.openSummary.addEventListener("click", () => {
      renderSummary();
      openSheet("summarySheet");
    });

    el.backdrop.addEventListener("click", closeActiveSheet);

    document.addEventListener("click", e => {
      const closeTarget = e.target.closest("[data-close]");
      if (!closeTarget) return;
      closeActiveSheet();
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeActiveSheet();
    });

    el.addForm.addEventListener("submit", e => {
      e.preventDefault();
      const formData = new FormData(el.addForm);
      const code = digitsOnly(formData.get("code"));
      const en = String(formData.get("en") || "").trim();
      const zh = String(formData.get("zh") || "").trim();

      if (!code) { alert("產品編號只可輸入數字，且不可留空。"); return; }
      if (!en) { alert("請輸入英文名稱。"); return; }

      const duplicated = state.products.some(item => item.code === code);
      if (duplicated) { alert("已有相同產品編號，請勿重複新增。"); return; }

      state.products.unshift({ id: uid(), code, en, zh, save: 0, return: 0 });
      el.addForm.reset();
      persistSoon();
      renderAll();
      closeActiveSheet();
    });

    el.resetAll.addEventListener("click", () => {
      const first = window.confirm("將清空全部已保存資料，並還原為預設產品名單。是否繼續？");
      if (!first) return;
      const second = window.confirm("請再次確認：此操作會刪除所有已輸入數量及你自行新增的產品。");
      if (!second) return;
      resetToSeedData();
    });

    hydrate();
  </script>
</body>
</html>
