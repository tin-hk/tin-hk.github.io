<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>股票風險回報計算系統 - Developed By Tin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body { 
            font-family: 'Inter', "Microsoft JhengHei", sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .tab-content { animation: fadeIn 0.2s ease-out; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        /* 避免鍵盤彈出時壓縮 UI */
        .main-container { height: 100vh; display: flex; flex-direction: column; }
    </style>
</head>
<body class="text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const USD_HKD_RATE = 7.8; 
        const STORAGE_KEY = 'stock_calc_v7_data';

        const Icon = ({ name, size = 18, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    iconRef.current.innerHTML = ''; 
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.style.width = `${size}px`;
                    i.style.height = `${size}px`;
                    if (className) i.className = className;
                    iconRef.current.appendChild(i);
                    window.lucide.createIcons({ attrs: { strokeWidth: 2.5 }, nameAttr: 'data-lucide' });
                }
            }, [name, size, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        function App() {
            const [activeTab, setActiveTab] = useState('calc'); 
            const [records, setRecords] = useState([]);
            const [isRRLocked, setIsRRLocked] = useState(false);
            const [targetRR, setTargetRR] = useState('2.0');
            const [status, setStatus] = useState(null);
            const [tpMode, setTpMode] = useState('price'); 
            const [slMode, setSlMode] = useState('price');

            const [form, setForm] = useState({
                symbol: '', name: '', price: '',
                tpPrice: '', tpPct: '',
                slPrice: '', slPct: '',
                capital: '100000', riskPct: '1', lotSize: '100',
                currency: 'HKD'
            });

            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try { setRecords(JSON.parse(saved)); } catch(e) { console.error(e); }
                }
            }, []);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            }, [records]);

            const showStatus = (msg) => {
                setStatus(msg);
                setTimeout(() => setStatus(null), 3000);
            };

            const calculateUpdates = (field, value, currentForm) => {
                const cp = parseFloat(currentForm.price);
                const rr = parseFloat(targetRR) || 2.0;
                let next = { ...currentForm, [field]: value };

                if (isNaN(cp) || cp <= 0) return next;

                if (field === 'tpPrice') {
                    const val = parseFloat(value);
                    next.tpPct = isNaN(val) ? '' : ((val - cp) / cp * 100).toFixed(2);
                    if (isRRLocked && !isNaN(val)) {
                        const slP = cp - ((val - cp) / rr);
                        next.slPrice = slP.toFixed(3);
                        next.slPct = ((cp - slP) / cp * 100).toFixed(2);
                    }
                } else if (field === 'tpPct') {
                    const val = parseFloat(value);
                    next.tpPrice = isNaN(val) ? '' : (cp * (1 + val / 100)).toFixed(3);
                    if (isRRLocked && !isNaN(val)) {
                        const slPercent = (val / rr);
                        next.slPct = slPercent.toFixed(2);
                        next.slPrice = (cp * (1 - slPercent / 100)).toFixed(3);
                    }
                } else if (field === 'slPrice') {
                    const val = parseFloat(value);
                    next.slPct = isNaN(val) ? '' : ((cp - val) / cp * 100).toFixed(2);
                    if (isRRLocked && !isNaN(val)) {
                        const tpP = cp + ((cp - val) * rr);
                        next.tpPrice = tpP.toFixed(3);
                        next.tpPct = ((tpP - cp) / cp * 100).toFixed(2);
                    }
                } else if (field === 'slPct') {
                    const val = parseFloat(value);
                    next.slPrice = isNaN(val) ? '' : (cp * (1 - val / 100)).toFixed(3);
                    if (isRRLocked && !isNaN(val)) {
                        const tpPercent = (val * rr);
                        next.tpPct = tpPercent.toFixed(2);
                        next.tpPrice = (cp * (1 + tpPercent / 100)).toFixed(3);
                    }
                } else if (field === 'price') {
                    const newPrice = parseFloat(value);
                    if (!isNaN(newPrice)) {
                        if (next.tpPct) next.tpPrice = (newPrice * (1 + parseFloat(next.tpPct) / 100)).toFixed(3);
                        if (next.slPct) next.slPrice = (newPrice * (1 - parseFloat(next.slPct) / 100)).toFixed(3);
                    }
                }
                return next;
            };

            const handleInput = (field, value) => {
                const updatedForm = calculateUpdates(field, value, form);
                setForm(updatedForm);
            };

            const autoApplyRR = () => {
                if (!form.price || !form.slPrice) {
                    showStatus("請先輸入進場價與止損位");
                    return;
                }
                const cp = parseFloat(form.price);
                const sl = parseFloat(form.slPrice);
                const rr = parseFloat(targetRR) || 2.0;
                const targetTp = cp + ((cp - sl) * rr);
                setForm({
                    ...form,
                    tpPrice: targetTp.toFixed(3),
                    tpPct: ((targetTp - cp) / cp * 100).toFixed(2)
                });
                showStatus(`已套用 R/R ${rr} 目標價`);
            };

            const results = useMemo(() => {
                const cp = parseFloat(form.price);
                const tp = parseFloat(form.tpPrice);
                const sl = parseFloat(form.slPrice);
                const cap = parseFloat(form.capital);
                const risk = parseFloat(form.riskPct);
                const lot = parseInt(form.lotSize) || 1;

                if (!cp || !tp || !sl || !cap || cp <= 0 || sl >= cp) return null;

                const riskAmtHKD = cap * (risk / 100);
                let shares = 0;
                if (form.currency === 'USD') {
                    const riskAmtUSD = riskAmtHKD / USD_HKD_RATE;
                    const lossPerShareUSD = cp - sl;
                    shares = Math.floor(riskAmtUSD / lossPerShareUSD);
                } else {
                    const lossPerShareHKD = cp - sl;
                    shares = Math.floor(riskAmtHKD / lossPerShareHKD);
                }

                const finalShares = Math.floor(shares / lot) * lot;
                const investment = finalShares * cp;
                const rr = ((tp - cp) / (cp - sl)).toFixed(2);

                return {
                    shares: finalShares,
                    investment,
                    rr,
                    riskAmtHKD,
                    isGood: parseFloat(rr) >= 2
                };
            }, [form]);

            const saveRecord = () => {
                if (!results || !form.symbol) {
                    showStatus("請輸入代碼並完成計算");
                    return;
                }
                const newRec = {
                    ...form, ...results,
                    id: Date.now(),
                    date: new Date().toLocaleDateString()
                };
                setRecords([newRec, ...records]);
                showStatus("策略已儲存");
            };

            const exportXLSX = () => {
                const data = records.map(r => ({ '日期': r.date, '代碼': r.symbol, '名稱': r.name, '幣種': r.currency, '進場價': r.price, '止盈價': r.tpPrice, '止損價': r.slPrice, '建議股數': r.shares, '盈虧比': r.rr }));
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Strategies");
                XLSX.writeFile(wb, "Stock_Strategies.xlsx");
            };

            const importXLSX = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const bstr = evt.target.result;
                    const wb = XLSX.read(bstr, { type: 'binary' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(ws);
                    const mapped = data.map((item, idx) => ({
                        id: Date.now() + idx,
                        date: item['日期'] || new Date().toLocaleDateString(),
                        symbol: item['代碼'] || '',
                        name: item['名稱'] || '',
                        currency: item['幣種'] || 'HKD',
                        price: item['進場價'] || '',
                        tpPrice: item['止盈價'] || '',
                        slPrice: item['止損價'] || '',
                        shares: item['建議股數'] || 0,
                        rr: item['盈虧比'] || 0
                    }));
                    setRecords([...mapped, ...records]);
                    showStatus("成功匯入紀錄");
                };
                reader.readAsBinaryString(file);
            };

            return (
                <div className="main-container select-none">
                    {status && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[999] bg-indigo-600 text-white px-5 py-2 rounded-full shadow-2xl font-bold text-xs flex items-center gap-2">
                            <Icon name="check-circle" size={14} /> {status}
                        </div>
                    )}

                    <header className="bg-white border-b border-slate-100 px-4 py-2 flex justify-between items-center z-40 shrink-0">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md">
                                <Icon name="trending-up" size={18} />
                            </div>
                            <div>
                                <h1 className="font-black text-slate-800 text-base tracking-tight leading-none">股票風險回報計算系統</h1>
                                <p className="text-[8px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Developed By Tin v7.2</p>
                            </div>
                        </div>
                        <div className="flex gap-1.5">
                            <label className="p-2 bg-slate-50 text-slate-500 rounded-lg cursor-pointer hover:bg-indigo-50 hover:text-indigo-600 transition-colors">
                                <Icon name="upload" size={16} />
                                <input type="file" className="hidden" accept=".xlsx, .xls" onChange={importXLSX} />
                            </label>
                            <button onClick={exportXLSX} className="p-2 bg-slate-50 text-slate-500 rounded-lg hover:bg-indigo-50 hover:text-indigo-600 transition-colors">
                                <Icon name="download" size={16} />
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden max-w-7xl mx-auto w-full px-3 pt-3 flex flex-col">
                        <div className="flex-1 grid md:grid-cols-12 gap-4 overflow-hidden">
                            {/* Left Column: Calculator Content */}
                            <div className={`${activeTab === 'calc' ? 'flex' : 'hidden'} md:flex md:col-span-6 flex-col overflow-hidden tab-content`}>
                                <div className="flex-1 overflow-y-auto custom-scrollbar pr-0.5 space-y-3 pb-24 md:pb-6">
                                    
                                    {/* Real-time Result Summary Board */}
                                    <div className="grid grid-cols-2 gap-3 shrink-0">
                                        <div className="bg-slate-900 text-white p-3 md:p-4 rounded-2xl shadow-md border border-slate-800">
                                            <p className="text-[9px] md:text-xs font-bold text-slate-400 uppercase mb-0.5">建議股數</p>
                                            <p className="text-xl md:text-2xl font-black">{results ? results.shares.toLocaleString() : '---'}</p>
                                            <p className="text-[10px] md:text-xs font-bold text-indigo-400">{results ? `$${results.investment.toLocaleString()}` : '等待輸入'}</p>
                                        </div>
                                        <div className={`p-3 md:p-4 rounded-2xl shadow-md border-2 ${results ? (results.isGood ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200') : 'bg-white border-slate-100'}`}>
                                            <p className={`text-[9px] md:text-xs font-bold uppercase mb-0.5 ${results ? (results.isGood ? 'text-emerald-600' : 'text-rose-600') : 'text-slate-400'}`}>盈虧比 (R/R)</p>
                                            <p className={`text-xl md:text-2xl font-black ${results ? (results.isGood ? 'text-emerald-700' : 'text-rose-700') : 'text-slate-300'}`}>{results ? results.rr : '---'}</p>
                                            <p className={`text-[9px] md:text-xs font-bold ${results ? (results.isGood ? 'text-emerald-600' : 'text-rose-600') : 'text-slate-300'}`}>
                                                {results ? (results.isGood ? '回報理想' : '風險較高') : '未生成'}
                                            </p>
                                        </div>
                                    </div>

                                    {/* Main Input Form */}
                                    <div className="bg-white p-4 md:p-5 rounded-[2rem] shadow-sm border border-slate-200 space-y-4">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-500 ml-1 uppercase">代碼</label>
                                                <div className="relative">
                                                    <input type="text" className="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl font-black text-xs md:text-sm uppercase outline-none focus:border-indigo-500 transition-all" placeholder="NVDA" value={form.symbol} onChange={(e) => {
                                                        const val = e.target.value.toUpperCase();
                                                        let isUS = /^[A-Z]{2,}$/.test(val);
                                                        setForm({...form, symbol: val, currency: isUS ? 'USD' : 'HKD', lotSize: isUS ? '1' : '100'});
                                                    }} />
                                                    <div className="absolute right-2 top-1/2 -translate-y-1/2 text-[8px] font-black text-indigo-400 bg-indigo-50 px-1 py-0.5 rounded">{form.currency}</div>
                                                </div>
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-500 ml-1 uppercase">名稱</label>
                                                <input type="text" className="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl font-bold text-xs md:text-sm outline-none focus:border-indigo-300 transition-all" value={form.name} onChange={(e) => setForm({...form, name: e.target.value})} />
                                            </div>
                                        </div>

                                        <div className="space-y-1">
                                            <div className="flex justify-between items-center px-1">
                                                <label className="text-[10px] font-black text-slate-600 uppercase tracking-wider">進場價 (Entry)</label>
                                                <div className="flex items-center gap-1.5">
                                                    <div className={`flex items-center gap-1.5 px-2 py-0.5 rounded-full border text-[9px] font-bold ${isRRLocked ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                                                        <span>R/R:</span>
                                                        <input type="number" step="0.1" className="w-6 bg-transparent text-center outline-none border-b border-current" value={targetRR} onChange={(e) => setTargetRR(e.target.value)} />
                                                        <button onClick={() => setIsRRLocked(!isRRLocked)} className="hover:scale-125 transition-transform"><Icon name={isRRLocked ? "lock" : "unlock"} size={10} /></button>
                                                    </div>
                                                    <button onClick={autoApplyRR} className="w-6 h-6 bg-indigo-600 text-white rounded-full flex items-center justify-center shadow hover:bg-indigo-700 active:scale-90 transition-all"><Icon name="zap" size={12} /></button>
                                                </div>
                                            </div>
                                            <input type="number" className="w-full p-3 bg-slate-900 text-white rounded-xl font-black text-2xl md:text-3xl outline-none border-2 border-slate-800 focus:border-indigo-500 transition-all" value={form.price} onChange={(e) => handleInput('price', e.target.value)} />
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="p-3 bg-emerald-50 rounded-2xl border border-emerald-100 space-y-1">
                                                <div className="flex justify-between items-center">
                                                    <span className="text-[10px] md:text-xs font-black text-emerald-600">止盈 (TP)</span>
                                                    <button onClick={() => setTpMode(tpMode === 'price' ? 'percent' : 'price')} className="bg-white border border-emerald-200 px-1.5 py-0.5 rounded-md text-[8px] md:text-[10px] font-black text-emerald-600 shadow-sm">{tpMode === 'price' ? '$' : '%'}</button>
                                                </div>
                                                <input type="number" className="w-full bg-transparent font-black text-lg md:text-xl text-emerald-700 outline-none" value={tpMode === 'price' ? form.tpPrice : form.tpPct} onChange={(e) => handleInput(tpMode === 'price' ? 'tpPrice' : 'tpPct', e.target.value)} />
                                                <p className="text-[9px] md:text-[10px] font-bold text-emerald-500/70">{tpMode === 'price' ? (form.tpPct || '0') + '%' : '$' + (form.tpPrice || '0')}</p>
                                            </div>
                                            <div className="p-3 bg-rose-50 rounded-2xl border border-rose-100 space-y-1">
                                                <div className="flex justify-between items-center">
                                                    <span className="text-[10px] md:text-xs font-black text-rose-600">止損 (SL)</span>
                                                    <button onClick={() => setSlMode(slMode === 'price' ? 'percent' : 'price')} className="bg-white border border-rose-200 px-1.5 py-0.5 rounded-md text-[8px] md:text-[10px] font-black text-rose-600 shadow-sm">{slMode === 'price' ? '$' : '%'}</button>
                                                </div>
                                                <input type="number" className="w-full bg-transparent font-black text-lg md:text-xl text-rose-700 outline-none" value={slMode === 'price' ? form.slPrice : form.slPct} onChange={(e) => handleInput(slMode === 'price' ? 'slPrice' : 'slPct', e.target.value)} />
                                                <p className="text-[9px] md:text-[10px] font-bold text-rose-500/70">{slMode === 'price' ? (form.slPct || '0') + '%' : '$' + (form.slPrice || '0')}</p>
                                            </div>
                                        </div>

                                        <div className="bg-slate-50 p-3 md:p-4 rounded-2xl border border-slate-100 grid grid-cols-2 gap-3">
                                            <div className="space-y-0.5">
                                                <label className="text-[9px] font-bold text-slate-400 uppercase">總資產 (HKD)</label>
                                                <input type="number" className="w-full bg-white border border-slate-200 p-1.5 rounded-lg font-black text-[10px] md:text-xs outline-none" value={form.capital} onChange={(e) => setForm({...form, capital: e.target.value})} />
                                            </div>
                                            <div className="space-y-0.5">
                                                <label className="text-[9px] font-bold text-slate-400 uppercase">單筆風險 %</label>
                                                <input type="number" className="w-full bg-white border border-slate-200 p-1.5 rounded-lg font-black text-[10px] md:text-xs outline-none" value={form.riskPct} onChange={(e) => setForm({...form, riskPct: e.target.value})} />
                                            </div>
                                            <div className="col-span-2 space-y-0.5">
                                                <label className="text-[9px] font-bold text-slate-400 uppercase">每手股數 (Lot Size)</label>
                                                <input type="number" className="w-full bg-white border border-slate-200 p-1.5 rounded-lg font-black text-[10px] md:text-xs outline-none" value={form.lotSize} onChange={(e) => setForm({...form, lotSize: e.target.value})} />
                                            </div>
                                        </div>

                                        <button onClick={saveRecord} disabled={!results} className="w-full py-3 bg-indigo-600 text-white rounded-xl font-black text-xs uppercase tracking-widest shadow-lg shadow-indigo-100 hover:bg-indigo-700 disabled:opacity-20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                                            <Icon name="save" size={16} /> 儲存策略
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Right Column: History/Records */}
                            <div className={`${activeTab === 'history' ? 'flex' : 'hidden'} md:flex md:col-span-6 flex-col overflow-hidden tab-content`}>
                                <div className="flex justify-between items-center px-1 mb-3 shrink-0">
                                    <h2 className="text-[10px] md:text-xs font-black text-slate-500 uppercase tracking-widest flex items-center gap-1.5">
                                        <Icon name="archive" size={14} /> 歷史策略 ({records.length})
                                    </h2>
                                    {records.length > 0 && (
                                        <button onClick={() => confirm('確定要清空所有紀錄？') && setRecords([])} className="text-[10px] font-bold text-rose-500 hover:bg-rose-50 px-2 py-1 rounded-md transition-colors">清空</button>
                                    )}
                                </div>

                                <div className="flex-1 overflow-y-auto custom-scrollbar pr-0.5 space-y-3 pb-24 md:pb-6">
                                    {records.length === 0 ? (
                                        <div className="h-full bg-white rounded-[2rem] border-2 border-dashed border-slate-100 flex flex-col items-center justify-center text-slate-300 p-6">
                                            <Icon name="folder-open" size={24} className="opacity-20 mb-2" />
                                            <p className="text-[9px] font-bold uppercase tracking-widest opacity-40 text-center">沒有策略</p>
                                        </div>
                                    ) : (
                                        records.map(rec => (
                                            <div key={rec.id} className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm hover:border-indigo-100 transition-all relative group">
                                                <div className="flex justify-between items-start mb-2">
                                                    <div className="flex items-center gap-2">
                                                        <div className="w-9 h-9 bg-slate-900 rounded-xl flex items-center justify-center text-white font-black text-[10px]">
                                                            {rec.symbol.substring(0, 4)}
                                                        </div>
                                                        <div>
                                                            <h3 className="font-black text-slate-800 text-xs md:text-sm leading-none">{rec.name || rec.symbol}</h3>
                                                            <p className="text-[9px] font-bold text-slate-400 mt-1">{rec.date}</p>
                                                        </div>
                                                    </div>
                                                    <div className={`px-2 py-0.5 rounded-full text-[9px] font-black ${parseFloat(rec.rr) >= 2 ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}`}>
                                                        R/R {rec.rr}
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-3 gap-1 py-2 border-y border-slate-50 text-center">
                                                    <div>
                                                        <p className="text-[8px] font-bold text-slate-400 uppercase mb-0.5">股數</p>
                                                        <p className="text-xs font-black text-slate-700">{rec.shares.toLocaleString()}</p>
                                                    </div>
                                                    <div className="border-x border-slate-100">
                                                        <p className="text-[8px] font-bold text-slate-400 uppercase mb-0.5">進場</p>
                                                        <p className="text-xs font-black text-slate-700">${rec.price}</p>
                                                    </div>
                                                    <div>
                                                        <p className="text-[8px] font-bold text-slate-400 uppercase mb-0.5">投資額</p>
                                                        <p className="text-xs font-black text-slate-700">${Math.round(rec.investment).toLocaleString()}</p>
                                                    </div>
                                                </div>

                                                <div className="flex gap-2 mt-3">
                                                    <button onClick={() => { setForm({...form, ...rec}); setActiveTab('calc'); }} className="flex-1 py-1.5 bg-indigo-50 text-indigo-600 rounded-lg font-black text-[10px] uppercase hover:bg-indigo-100 transition-colors">載入</button>
                                                    <button onClick={() => setRecords(records.filter(r => r.id !== rec.id))} className="px-3 flex items-center justify-center bg-rose-50 text-rose-400 rounded-lg hover:bg-rose-500 hover:text-white transition-all"><Icon name="trash-2" size={14} /></button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Bottom Nav for Mobile */}
                    <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl border-t border-slate-100 px-8 py-2.5 flex justify-around items-center z-50 safe-area-bottom shadow-lg">
                        <button onClick={() => setActiveTab('calc')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'calc' ? 'text-indigo-600 scale-105' : 'text-slate-300'}`}>
                            <Icon name="calculator" size={20} />
                            <span className="text-[9px] font-black uppercase tracking-wider">計算器</span>
                        </button>
                        <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'history' ? 'text-indigo-600 scale-105' : 'text-slate-300'}`}>
                            <div className="relative">
                                <Icon name="layers" size={20} />
                                {records.length > 0 && <span className="absolute -top-1 -right-1.5 bg-rose-500 text-white text-[8px] w-3.5 h-3.5 rounded-full flex items-center justify-center font-bold">{records.length}</span>}
                            </div>
                            <span className="text-[9px] font-black uppercase tracking-wider">策略庫</span>
                        </button>
                    </nav>

                    <footer className="hidden md:block py-2 text-center border-t border-slate-100 bg-white shrink-0">
                        <p className="text-[9px] font-bold text-slate-300 uppercase tracking-[0.5em]">System Design by Tin • 2026</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
