<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人網站導航</title>
    <!-- 引入 Noto Sans TC 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            /* 天藍色概念漸層：從清晨天空藍到淡藍色 */
            background: linear-gradient(135deg, #7ad7f0 0%, #92b1d4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: #333;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .nav-link {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.4);
            color: #1a365d;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border-color: rgba(255, 255, 255, 0.8);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeInUp 0.8s ease-out forwards;
        }
    </style>
</head>
<body class="p-6">

    <div class="glass-card w-full max-w-md p-10 text-center animate-in">
        <!-- 圖示區 -->
        <div class="mb-8">
            <div class="w-20 h-20 bg-white/40 rounded-3xl mx-auto flex items-center justify-center text-4xl mb-4 shadow-inner">
                👨🏻‍💻
            </div>
            <h1 class="text-2xl font-bold text-slate-800 mb-2">Tin - Web App 網頁應用程式</h1>
            <p class="text-slate-600 text-sm">點擊下方連結進入對應網站</p>
        </div>

        <!-- 導覽連結區域 -->
        <div class="space-y-5">
            
            <!-- 網站項目：若要增加，複製此 <a> 標籤即可 -->
            <a href="https://tin-hk.github.io/stockapp" target="_blank" class="nav-link block py-4 px-6 rounded-2xl text-lg font-semibold border border-white/20">
                📈 股票風險回報計算系統
            </a>
            
            <!-- 預留位置範例 (已註解) -->
            <!-- 
            <a href="#" target="_blank" class="nav-link block py-4 px-6 rounded-2xl text-lg font-semibold border border-white/20">
                🚀 新增網站連結
            </a> 
            -->

        </div>

        <!-- 頁尾：移除年份資訊 -->
        <div class="mt-12 pt-6 border-t border-white/20 text-xs text-slate-500 font-medium">
            Created by Tin
        </div>
    </div>

</body>
</html>
